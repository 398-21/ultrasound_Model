# Stage 2 run 4: run 3 (with reference photos) plus augmentation for other photo conditions and jittered crop
# windows (docs/features.md, F6). Everything else as run 3. See PROGRESS_LOG 2026-10-09.
# Run from the epills folder:  .venv\Scripts\python scripts\train_stage2.py --config configs\stage2_run4.yaml
name: stage2_run4
seed: 2026

data:
  manifest: data/processed/c3pi_splits/manifest_with_refs.csv   # + reference crops in train (D7)
  images: data/interim/c3pi/crops/images
  workers: 12

model:
  embedding_dim: 256
  refine_pool: mean        # mean = the FER block; concat = 4 tokens x 64 without pooling (ablation)
  aux_heads: true          # shape and colour heads (the plan's lambda_1, lambda_2)

loss:
  metric: arcface          # arcface or triplet (E4)
  arcface_margin: 0.3
  arcface_margin_warmup_epochs: 3   # margin 0, 0.1, 0.2, then 0.3 from epoch 4
  arcface_scale: 32
  triplet_margin: 0.2
  lambda_shape: 0.2
  lambda_colour: 0.2

augment:
  colour_jitter: 0.05      # saturation 0.05, hue 0.0125: colour identifies pills, so hue stays nearly fixed
  crop_jitter:             # a detector's box error: window size x0.75-1.35 (tight to loose) and its centre shifted
    scale: [0.75, 1.35]    # by up to 10% of its side; the pill then fills ~50-95% of the frame
    shift: 0.1             # (runs 1-3: a random 75-100% of the crop's area)
  photo:                   # other phones and light (MEDISEG: other cameras, small pills)
    brightness: 0.3
    contrast: 0.3
    white_balance: 0.08    # red and blue gains within +-8%
    downscale_p: 0.3       # shrink to 40-160 px and back: small, low-resolution pills
    downscale_px: [40, 160]
    jpeg_p: 0.3
    jpeg_quality: [30, 90]
    noise_p: 0.2
    noise_std: 0.03
  neighbour_p: 0.2         # another pill pasted partly into the frame

# The FER schedule: phase 1 with the ViT and VGG16 blocks 1-3 frozen, phase 2 with everything trainable.
# lr: pretrained backbones (VGG16, ViT); head_lr: the new parts (CBAM, fusion, refinement, heads), at the FER rate;
# metric_lr: the ArcFace class table (1,710 x 256, starts random, barely moves at the FER rate).
phases:
  - {phase: 1, epochs: 25, p: 32, k: 4, lr: 3.0e-5, head_lr: 3.0e-5, metric_lr: 1.0e-3}
  - {phase: 2, epochs: 35, p: 16, k: 4, lr: 1.0e-5, head_lr: 1.0e-5, metric_lr: 1.0e-4}
weight_decay: 1.0e-3
plateau: {factor: 0.5, patience: 3, min_lr: 1.0e-6}   # ReduceLROnPlateau, as in FER
early_stopping_patience: 6                           # per phase; the best epoch's weights are restored
select_metric: top1_all                              # higher is better; computed on val_enrolled

eval:
  k_enrol: 3        # enrolment photos per medication (the plan: 3-5)
  batch: 128
